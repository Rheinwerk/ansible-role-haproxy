---
_haproxy:
  use_default_config: "yes"
  instance_name: "demo-haproxy"
  version: "{{ _haproxy_default_version[ansible_facts['distribution_release']] | default('2.8*') }}"
  admin:
    user: "admin"
    password: "this-is-secret"
    binds:
      - ip: "0.0.0.0"
        port: 8404
  error_files: []
